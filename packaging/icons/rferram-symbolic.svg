<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- rFerram Theme-Adaptive Symbolic Stained-Glass Emblem ("rF") -->
  <rect x="4" y="4" width="56" height="56" rx="14" ry="14" fill="none" stroke="currentColor" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="currentColor" stroke-width="2" opacity="0.55"/>
  <!-- Stained-glass lead-came lattice lines -->
  <line x1="4" y1="30" x2="60" y2="30" stroke="currentColor" stroke-width="1.6" opacity="0.45"/>
  <line x1="4" y1="42" x2="60" y2="42" stroke="currentColor" stroke-width="1.6" opacity="0.45"/>
  <line x1="32" y1="4" x2="32" y2="60" stroke="currentColor" stroke-width="1.6" opacity="0.45"/>
  <line x1="12" y1="12" x2="52" y2="52" stroke="currentColor" stroke-width="1.4" opacity="0.35"/>
  <line x1="52" y1="12" x2="12" y2="52" stroke="currentColor" stroke-width="1.4" opacity="0.35"/>
  <!-- Accent stained-glass facets -->
  <polygon points="32,10 22,30 32,30" fill="currentColor" opacity="0.18"/>
  <polygon points="32,10 44,30 32,30" fill="currentColor" opacity="0.12"/>
  <polygon points="14,30 26,42 32,30" fill="currentColor" opacity="0.16"/>
  <!-- "r" glyph -->
  <path d="M18 48 V36 M15.5 36 H20.5 M20.5 40 C22.5 36.2 26.5 35.5 29.5 37.5 M15.5 48 H21.5"
        fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- "F" glyph -->
  <path d="M34 48 V21 M30.5 21 H51 V25.5 M34 34 H45 M45 31 V37 M30.5 48 H38.5"
        fill="none" stroke="currentColor" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
