[workspace]
resolver = "3"
members = [
    "crates/rferram-common",
    "crates/rferram-protocol",
    "crates/rferram-net",
    "crates/rferram-channels",
    "crates/rferram-client",
    "crates/rferram-server",
    "crates/rferram-ui",
]
exclude = [
    "vendor/ST_Rust_Age",
    "vendor/libcosmic",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["TheInfoMoose"]
license = "GPL-3.0-only"
rust-version = "1.93"
repository = "https://github.com/TheInfoMoose/rFerram"

[workspace.dependencies]
# Internal Workspace Crates
rferram-common = { path = "crates/rferram-common", version = "0.1.0" }
rferram-protocol = { path = "crates/rferram-protocol", version = "0.1.0" }
rferram-net = { path = "crates/rferram-net", version = "0.1.0" }
rferram-channels = { path = "crates/rferram-channels", version = "0.1.0" }
rferram-client = { path = "crates/rferram-client", version = "0.1.0" }
rferram-server = { path = "crates/rferram-server", version = "0.1.0" }
rferram-ui = { path = "crates/rferram-ui", version = "0.1.0" }

# Simply Transfer v2 Integration (ST_Rust_Age)
simply-transfer-core = { path = "vendor/ST_Rust_Age/simply-transfer-core", version = "0.1.0" }
simply-transfer-crypto = { path = "vendor/ST_Rust_Age/simply-transfer-crypto", version = "0.1.0" }
simply-transfer-snapshots = { path = "vendor/ST_Rust_Age/simply-transfer-snapshots", version = "0.1.0" }

# Graphical UI & Rendering Engine (COSMIC Native + Linux, macOS, Windows)
libcosmic = { path = "vendor/libcosmic", version = "1.0.0", features = ["tokio", "wgpu", "winit", "multi-window"] }
cosmic-config = { path = "vendor/libcosmic/cosmic-config", version = "1.0.0" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "wgsl"] }
glow = "0.18.0"
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
raw-window-handle = "0.6.2"
bytemuck = { version = "1.25.2", features = ["derive"] }
tiny-skia = "0.12.0"
taffy = "0.10.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "ico"] }
png = "0.18.1"
rfd = "0.17.2"
notify = "8.2.0"
notify-rust = "4.18.2"

# Linux Wayland / Smithay / DRM / X11 Capture & Input Backends (Debian, RHEL, SUSE, Arch)
smithay-client-toolkit = "0.19.2"
wayland-client = "0.31.15"
wayland-backend = "0.3.17"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
calloop = "0.14.5"
drm = "0.14.1"
drm-fourcc = "2.2.0"
gbm = "0.18.0"
input = "0.10.0"
libseat = "0.2.4"
udev = "0.9.3"
xkbcommon = "0.9.0"
x11rb = { version = "0.13.2", features = ["shm", "xfixes", "xtest", "randr"] }

# Windows DXGI / D3D11 / WASAPI / Win32 Backends
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D11",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Networking_WinSock",
] }
windows-sys = "0.61.2"

# macOS ScreenCaptureKit / Metal / CoreGraphics / CoreAudio Backends (objc2 Ecosystem)
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-io-surface = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-metal = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["std"] }

# Video Encoding Engine
rav1e = { version = "0.8.1", default-features = false, features = ["threading"] }

# Network, Transport & NIST Cryptographic Security
quinn = { version = "0.11.12", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
quinn-proto = "0.11.19"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "aws-lc-rs", "std", "tls12"] }
rcgen = "0.14.10"
socket2 = { version = "0.6.5", features = ["all"] }
if-addrs = "0.15.0"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "aws-lc-rs"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
sha2 = "0.11.0"
aes-gcm = "0.10.3"
zeroize = "1.9.1"
base64 = "0.23.1"
hex = "0.4.3"
rand = "0.10.3"

# OS Integration, Clipboard, Credentials & System Telemetry
arboard = "3.7.0"
keyring-core = "1.0.0"
sysinfo = "0.39.6"
libc = "0.2.191"

# Async Core, Serialization & Utilities
tokio = { version = "1.53.3", features = ["full"] }
futures = "0.3.34"
async-trait = "0.1.92"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
postcard = { version = "1.1.3", default-features = false, features = ["use-std", "alloc"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
walkdir = "2.5.0"
tempfile = "3.27.0"

# Structured Logging & Diagnostics
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[patch."https://github.com/TheInfoMoose/ST_Rust_Age"]
simply-transfer-core = { path = "vendor/ST_Rust_Age/simply-transfer-core" }
simply-transfer-crypto = { path = "vendor/ST_Rust_Age/simply-transfer-crypto" }
simply-transfer-snapshots = { path = "vendor/ST_Rust_Age/simply-transfer-snapshots" }

[patch."https://github.com/pop-os/libcosmic"]
libcosmic = { path = "vendor/libcosmic" }
cosmic-config = { path = "vendor/libcosmic/cosmic-config" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
