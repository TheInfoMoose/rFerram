[package]
name = "rferram-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Elevated host capture daemon, hardware encoder pipeline, and OS input injector for rFerram"

[[bin]]
name = "rferram-server"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
rferram-channels = { workspace = true }
rferram-common = { workspace = true }
rferram-net = { workspace = true }
rferram-protocol = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
wgpu = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
drm-fourcc = { workspace = true }
wayland-backend = { workspace = true }
wayland-client = { workspace = true }
wayland-protocols = { workspace = true }
wayland-protocols-wlr = { workspace = true }
x11rb = { workspace = true }
xkbcommon = { workspace = true }
zbus = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
windows-sys = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { workspace = true }
objc2-core-foundation = { workspace = true }
objc2-core-graphics = { workspace = true }
objc2-foundation = { workspace = true }
objc2-io-surface = { workspace = true }
objc2-metal = { workspace = true }
objc2-quartz-core = { workspace = true }
