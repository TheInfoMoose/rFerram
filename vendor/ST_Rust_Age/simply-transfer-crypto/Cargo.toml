[package]
name = "simply-transfer-crypto"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.23.1"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
keyring = "4.2.0"
rand = "0.10.3"
rand_core = "0.10.1"
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.0"
ssh-key = { version = "0.6.7", default-features = false, features = ["alloc", "ed25519", "rand_core"] }
thiserror = "2.0.21"
zeroize = "1.9.0"
