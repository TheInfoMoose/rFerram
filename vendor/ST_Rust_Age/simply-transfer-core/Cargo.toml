[package]
name = "simply-transfer-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
simply-transfer-crypto = { version = "0.1.0", path = "../simply-transfer-crypto" }
simply-transfer-snapshots = { version = "0.1.0", path = "../simply-transfer-snapshots" }
async-trait = "0.1"
russh = { version = "0.64.1", default-features = false, features = ["flate2", "aws-lc-rs"] }
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
walkdir = "2.5.0"
futures = "0.3.34"
quinn = "0.11.12"
rustls = "0.23.46"
rcgen = "0.14.10"
rand = "0.10.3"
base64 = "0.23.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
